<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>每日新闻制图 / Daily News Studio</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="studio.mjs"></script>
</head>
<body>
<header><a class="wordmark" href="./" data-copy="brand">每日新闻制图</a><a class="version-link" href="../" data-copy="autoVersion">自动新闻版</a><label><span class="sr" data-copy="language">界面语言</span><select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></label></header>
<main>
  <section class="intro"><h1 data-copy="heading">把你整理的新闻做成一张图</h1><p data-copy="intro">选日期，录入标题或导入文本，在浏览器里生成 PNG。</p></section>
  <div class="workspace">
    <section class="editor" aria-labelledby="controls-title">
      <h2 id="controls-title" data-copy="controls">日期和内容</h2>
      <label for="date" data-copy="date">图片日期</label>
      <div class="date-row"><input id="date" type="date" required><button id="today" type="button" data-copy="today">今天</button></div>
      <form id="content-form">
        <label for="paste" data-copy="paste">新闻标题</label>
        <p id="input-hint" data-copy="hint">每行一条标题。可在标题后加竖线和来源链接。</p>
        <textarea id="paste" rows="6" maxlength="6000" aria-describedby="input-hint" placeholder="你整理的标题 | https://example.com/story"></textarea>
        <div class="date-row">
          <button id="generate" class="primary" data-copy="generate">生成预览</button>
          <button id="import-button" type="button" data-copy="import">导入 TXT</button>
          <button id="example" type="button" data-copy="example">试用虚构示例</button>
          <input id="import-file" type="file" accept=".txt,text/plain" hidden>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <fieldset id="story-picker" hidden><legend data-copy="choose">选入图片的条目</legend><ul id="stories"></ul></fieldset>
    </section>
    <section class="output" aria-labelledby="preview-title">
      <div class="output-header"><h2 id="preview-title" data-copy="preview">图片预览</h2><button id="download" type="button" class="primary" disabled data-copy="download">下载 PNG</button></div>
      <div class="sheet"><canvas id="poster" width="1200" height="1440" hidden aria-label="图片预览"></canvas><p id="empty" data-copy="empty">输入标题后，点击「生成预览」。</p></div>
    </section>
  </div>
</main>
</body>
</html>
